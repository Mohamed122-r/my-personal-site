<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اطلب خدمة — محمد عبد الوهاب</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="logo"><a href="index.html" style="text-decoration:none; color:inherit;">محمد عبد الوهاب</a></div>
      <ul class="nav-links">
        <li><a href="index.html">الرئيسية</a></li>
        <li><a href="services.html">خدماتي</a></li>
        <li><a href="projects.html">أعمالي</a></li>
        <li><a href="order.html" style="color:var(--primary);">اطلب خدمة</a></li>
        <li><a href="contact.html">تواصل</a></li>
      </ul>
    </div>
  </nav>

  <section class="section order-section" style="min-height: 80vh; padding-top: 50px;">
    <div class="container">
      <h2 class="section-title">اطلب خدمة</h2>
      <p class="section-subtitle">أخبرني بما تحتاجه وسأرد عليك قريباً</p>
      <form class="order-form" id="order-form">
        <div class="form-group">
          <label for="client-name">الاسم الكامل</label>
          <input type="text" id="client-name" name="name" required placeholder="اكتب اسمك">
        </div>
        <div class="form-group">
          <label for="client-contact">البريد أو رقم الواتساب</label>
          <input type="text" id="client-contact" name="contact" required placeholder="مثال: 0960000000">
        </div>
        <div class="form-group">
          <label for="service-type">نوع الخدمة</label>
          <select id="service-type" name="service_type" required>
            <option value="">اختر الخدمة</option>
            <option value="تطوير موقع">تطوير موقع</option>
            <option value="نظام ERP">نظام ERP</option>
            <option value="تطبيق ويب/موبايل">تطبيق ويب/موبايل</option>
            <option value="استشارة تقنية">استشارة تقنية</option>
            <option value="أخرى">أخرى</option>
          </select>
        </div>
        <div class="form-group">
          <label for="service-details">تفاصيل الطلب</label>
          <textarea id="service-details" name="details" required placeholder="اشرح ما تحتاجه..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">إرسال الطلب</button>
        <div class="form-message" id="form-message"></div>
      </form>
    </div>
  </section>

  <footer class="footer"><p>© <span id="year"></span> محمد عبد الوهاب — جميع الحقوق محفوظة</p></footer>
  <a href="#" class="whatsapp-float" id="whatsapp-float" target="_blank">💬</a>
  
  <div class="mobile-bottom-nav">
    <a href="index.html"><span>🏠</span>الرئيسية</a>
    <a href="services.html"><span>💼</span>خدماتي</a>
    <a href="projects.html"><span>🖼️</span>أعمالي</a>
    <a href="order.html" class="active"><span>📝</span>اطلب</a>
    <a href="contact.html"><span>📞</span>تواصل</a>
  </div>

  <script src="supabase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
